name: Deploy Smart Home System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Проверка импорта backend
        run: |
          cd backend
          python -c "from app.main import app; print('OK')"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Логин в Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Сборка и публикация backend
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/smart-home-backend:latest ./backend
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/smart-home-backend:latest

      - name: Сборка и публикация frontend
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/smart-home-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/smart-home-frontend:latest